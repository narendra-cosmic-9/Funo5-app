name: FUNO5 APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Give permission
        run: chmod +x gradlew || echo "no gradlew, using gradle"

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi

      - name: Upload APK to Artifacts (Download here)
        uses: actions/upload-artifact@v4
        with:
          name: Funo5-APK-Download
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: funo5-v1-${{ github.run_number }}
           generate_release_notes
          
