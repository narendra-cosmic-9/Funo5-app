name: Build and Publish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_NAME: app-debug.apk
  APK_REL_PATH: app/build/outputs/apk/debug/app-debug.apk
  RELEASE_TAG: v2.0-${{ github.run_number }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle wrapper
            ./gradlew assembleDebug
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: Funo5 ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body: |
            Automated build of the debug APK (run ${{ github.run_number }}).

      - name: Upload APK as Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.APK_REL_PATH }}
          asset_name: ${{ env.APK_NAME }}
          asset_content_type: application/vnd.android.package-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output APK download URL
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.APK_NAME }}"
          echo "APK_DOWNLOAD_URL=${DOWNLOAD_URL}"
          echo "${DOWNLOAD_URL}" > apk_link.txt
          # set a job output (if other jobs want to consume it)
          echo "apk_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT

      - name: Upload apk_link.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: Funo5-APK-Link
          path: apk_link.txt
